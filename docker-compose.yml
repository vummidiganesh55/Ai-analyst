services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexora-ai:local
    container_name: nexora-ai-backend
    command:
      - uvicorn
      - app.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/database/bi_agent.duckdb
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: nexora-ai:local
    container_name: nexora-ai-frontend
    command:
      - streamlit
      - run
      - streamlit_app/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8502:8501"
    environment:
      NEXORA_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped